<app-layout>
    <div>
        <ion-list class="communitieslist">
            <ion-reorder-group [disabled]="false">
                <!-- *ngFor="let community of communities" -->
                <ion-item>
                    <ion-grid>
                        <ion-row>
                            <ion-col size="auto">
                                <ion-reorder>
                                    <ion-icon
                                        name="menu"
                                        size="large"
                                    ></ion-icon>
                                </ion-reorder>
                            </ion-col>
                            <ion-col>
                                <h3 class="title">
                                    Penne à la carbo car c'est bon (^^)
                                </h3>
                            </ion-col>
                            <ion-col size="auto">
                                <ion-badge color="danger">
                                    <h2 class="title">45</h2>
                                </ion-badge>
                            </ion-col>
                            <ion-col size=" auto">
                                <ion-button>
                                    <ion-icon
                                        slot="icon-only"
                                        name="caret-forward"
                                        size="large"
                                    ></ion-icon>
                                </ion-button>
                            </ion-col>
                        </ion-row>
                    </ion-grid>
                </ion-item>
            </ion-reorder-group>
        </ion-list>
    </div>
</app-layout>
